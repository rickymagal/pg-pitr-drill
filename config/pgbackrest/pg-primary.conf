[global]
repo1-host=backup-repo
repo1-host-type=tls
repo1-host-cert-file=/etc/pgbackrest/cert/pg-primary.crt
repo1-host-key-file=/etc/pgbackrest/cert/pg-primary.key
repo1-host-ca-file=/etc/pgbackrest/cert/ca.crt
repo1-host-user=postgres
repo1-cipher-type=aes-256-cbc

[pitr-drill]
pg1-path=/var/lib/postgresql/data
