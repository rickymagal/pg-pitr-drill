name: pg-pitr-drill

x-pg-image: &pg-image
  image: pg-pitr-drill:local

networks:
  drillnet:
    driver: bridge

volumes:
  pgdata-primary:
  pgdata-recovery:
  repo-data:

services:
  pg-primary:
    <<: *pg-image
    build:
      context: .
      dockerfile: Dockerfile
    hostname: pg-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["/usr/local/bin/pgbr-init.sh"]
    command: ["docker-entrypoint.sh", "postgres"]
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - ./pki/pg-primary:/pki:ro
      - ./config/pgbackrest/pg-primary.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts/pgbr-init.sh:/usr/local/bin/pgbr-init.sh:ro
    networks: [drillnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-recovery:
    <<: *pg-image
    pull_policy: never
    hostname: pg-recovery
    entrypoint: ["/usr/local/bin/pgbr-init.sh"]
    command: ["sleep", "infinity"]
    volumes:
      - pgdata-recovery:/var/lib/postgresql/data
      - ./pki/pg-recovery:/pki:ro
      - ./config/pgbackrest/pg-recovery.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts/pgbr-init.sh:/usr/local/bin/pgbr-init.sh:ro
    networks: [drillnet]

  backup-repo:
    <<: *pg-image
    pull_policy: never
    hostname: backup-repo
    entrypoint: ["/usr/local/bin/pgbr-init.sh"]
    command: ["gosu", "postgres", "pgbackrest", "server"]
    volumes:
      - repo-data:/var/lib/pgbackrest
      - ./pki/backup-repo:/pki:ro
      - ./config/pgbackrest/backup-repo.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts/pgbr-init.sh:/usr/local/bin/pgbr-init.sh:ro
    networks: [drillnet]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8432"]
      interval: 5s
      timeout: 3s
      retries: 20
