name: pg-pitr-drill

networks:
  drillnet:
    driver: bridge

volumes:
  pgdata-primary:
  pgdata-recovery:
  repo-data:

services:
  pg-primary:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    hostname: pg-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
    networks: [drillnet]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-recovery:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    hostname: pg-recovery
    command: ["sleep", "infinity"]
    volumes:
      - pgdata-recovery:/var/lib/postgresql/data
    networks: [drillnet]

  backup-repo:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    hostname: backup-repo
    command: ["sleep", "infinity"]
    volumes:
      - repo-data:/var/lib/pgbackrest
    networks: [drillnet]
