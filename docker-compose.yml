name: pg-pitr-drill

x-pg-image: &pg-image
  image: pg-pitr-drill:local

networks:
  drillnet:
    driver: bridge

volumes:
  pgdata-primary:
  pgdata-recovery:
  repo-data:

services:
  pg-primary:
    <<: *pg-image
    build:
      context: .
      dockerfile: Dockerfile
    hostname: pg-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
    networks: [drillnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-recovery:
    <<: *pg-image
    pull_policy: never
    hostname: pg-recovery
    command: ["sleep", "infinity"]
    volumes:
      - pgdata-recovery:/var/lib/postgresql/data
    networks: [drillnet]

  backup-repo:
    <<: *pg-image
    pull_policy: never
    hostname: backup-repo
    command: ["sleep", "infinity"]
    volumes:
      - repo-data:/var/lib/pgbackrest
    networks: [drillnet]
